name: nightly-health

on:
  schedule:
    # 07:00 UTC = 10:00 IL — the law requires daily files "by store
    # opening" (~09:00 IL); checking earlier catches late publishers
    # mid-upload and reports false degradations
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . boto3
      - run: cp docs/health.json /tmp/prev-health.json
      - run: python scripts/health_check.py
        env:
          # optional Israeli egress for the geo-restricted portals;
          # without it those chains report "down" instead of "geo-blocked"
          IL_PROXY: ${{ secrets.IL_PROXY }}
      - name: Alert on status changes
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SES_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY }}
        run: python scripts/health_alert.py /tmp/prev-health.json docs/health.json
      - name: Alert on run failure
        if: failure()
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SES_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY }}
        run: pip install boto3 && python scripts/health_alert.py --run-failed
      - name: Commit health report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/health.json docs/health.md docs/health-badge.json
          if ! git diff --cached --quiet; then
            git commit -m "health: nightly check [skip ci]"
            git pull --rebase origin main
            git push
          fi
